<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>NPC Dashboard - GreenZone 420</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="npc-dashboard-ui" style="display:none;">
    <div class="header">
      <img src="img/logo.png" class="header-logo" alt="Logo"
           onerror="this.onerror=null;this.src='https://via.placeholder.com/78x78?text=Logo';" />
      <span id="header-icon"><i class="fa-solid fa-users"></i></span>
      <span id="station-title" class="ui-effektrotgrau">
        NPC-Dashboard
        <span class="tablet-servername ui-effektrotgrau" id="header-servername">GreenZone 420</span>
      </span>
      <button class="close-btn ui-effektrotgrau" id="close-btn" title="Schließen"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="tab-bar" id="tab-bar"></div>
    <div class="body">
      <!-- Panel: NPC-Liste -->
      <div id="npc-list-panel" style="display:block;">
        <table id="npcTable" class="npc-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Modell</th>
              <th>Waffe</th>
              <th>Verhalten</th>
              <th>Radius</th>
              <th>X</th>
              <th>Y</th>
              <th>Z</th>
              <th>Sichtweise</th>
              <th>Bewegung</th>
              <th>Gruppen-Ausnahme</th>
              <th>Jobs-Ausnahme</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="npc-list"></tbody>
        </table>
      </div>
      <!-- Panel: NPC erstellen/bearbeiten -->
      <div id="npc-create-panel" style="display:none;">
        <form class="npc-create-form" id="npc-create-form" autocomplete="off">
          <label for="npc-type-select">NPC-Typ</label>
          <select id="npc-type-select"></select>
          <label for="npc-model">Modell</label>
          <input type="text" id="npc-model">
          <label for="npc-weapon">Waffe</label>
          <select id="npc-weapon"></select>
          <label for="npc-behavior">Verhalten</label>
          <select id="npc-behavior"></select>
          <label for="npc-radius">Radius (Meter)</label>
          <input type="number" id="npc-radius" min="1" max="100">
          <label for="npc-heading">Sichtweise (Heading)</label>
          <input type="number" id="npc-heading" step="0.1">
          <label for="npc-movement"><input type="checkbox" id="npc-movement"> Bewegung</label>
          <label for="npc-ignore-groups">Gruppen von Angriff ausnehmen (Komma getrennt):</label>
          <input type="text" id="npc-ignore-groups" placeholder="z.B. admin,supporter">
          <label for="npc-ignore-jobs">Jobs von Angriff ausnehmen (Komma getrennt):</label>
          <input type="text" id="npc-ignore-jobs" placeholder="z.B. police,ambulance">
          <div style="margin-top:10px;">
            <button id="npc-create-btn" type="button">NPC erstellen (Koordinaten wählen)</button>
            <button id="npc-save-btn" type="button" style="display:none;">NPC speichern</button>
          </div>
        </form>
      </div>
    </div>
    <div class="dashboard-footer">
      <span class="footer-copyright">
        <i class="fa-regular fa-copyright"></i>
      </span>
      <span class="footer-server">GreenZone420</span>
      <span class="footer-divider">|</span>
      <span class="footer-author">Autor: MTJ2024</span>
    </div>
  </div>
  <!-- Mouse-Pick Overlay -->
  <div id="mouse-pick-overlay" style="display:none;">
    <div id="overlay"></div>
    <div id="helptext">Gehe an die gewünschte Stelle und drücke ENTER!</div>
  </div>
  <script>
    if (typeof GetParentResourceName === "function") {
      fetch(`https://${GetParentResourceName()}/htmlGeladen`, { method: 'POST' });
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
